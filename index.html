<html lang="ar" dir="rtl">
<head>

  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- SEO Meta Tags -->
  <title>CreatorMarket - المنصة العالمية للخدمات</title>
  <meta name="description" content="CreatorMarket - المنصة العالمية للخدمات الرقمية. اربط مع أفضل المبدعين في العالم. خدمات تصميم، برمجة، تسويق والمزيد." />
  <meta name="keywords" content="Freelance, Services, Marketplace, Design, Programming, Marketing, Remote Work, Jobs" />
  <meta name="author" content="CreatorMarket" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://creatormarket.com/" />
  <meta property="og:title" content="CreatorMarket - المنصة العالمية للخدمات" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; }
    #root { min-height: 100vh; }
    .loading { 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #1e3a5f;
      color: white;
      font-size: 20px;
    }
  </style>
  <script>
    window.loading = false;
    window.initialized = false;
    window.isAdmin = false;
    window.user = null;
    window.profile = null;
    
    window.onerror = function(msg, src, line, col, error) {
      console.error('GLOBAL ERROR:', msg, 'at line', line, 'col', col, 'Error:', error);
      document.getElementById('root').innerHTML = '<div style="padding:20px;text-align:center;font-family:Cairo,sans-serif;background:#1e3a5f;color:white;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;"><h1>خطأ في تحميل التطبيق</h1><p style="color:#ff6b6b;margin-top:10px;">' + msg + '</p><p>Line: ' + line + '</p></div>';
      return true;
    };
    window.onunhandledrejection = function(event) {
      console.error('Unhandled Promise Rejection:', event.reason);
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"><div class="loading">جاري التحميل...</div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
